[project]
name = "turf-tools-infra-example"
version = "0.0.0"
description = "Example Pulumi program provisioning one machine for Turf Tools"
requires-python = ">=3.12"
dependencies = [
    "pulumi>=3.140,<4.0",
    "pulumi-latitudesh",
]

[tool.uv.sources]
pulumi-latitudesh = { path = "sdks/latitudesh" }

[tool.ruff]
target-version = "py312"
line-length = 120
# Generated by `pulumi package add`; never hand-edited, never linted.
extend-exclude = ["sdks"]
